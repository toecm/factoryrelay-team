name: Deploy Factory Relay team portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-relay-team-pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.FACTORY_PORTAL_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and stage the curated static website
        run: node scripts/verify-static.mjs --stage
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload website files only
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site
  deploy:
    if: vars.FACTORY_PORTAL_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy team portal
        id: deployment
        uses: actions/deploy-pages@v4
